<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Arman Hosseinmardi, full stack software developer at Nurau</title>
  <desc id="desc">Frontline voice, photos and notes become signals, then risk events, then resolved risks.</desc>
  <style>
    .card { fill: #071C22; }
    .grid { stroke: #0F2C34; stroke-width: 1; }
    .ink { fill: #F4F7F7; }
    .muted { fill: #8FA3A8; }
    .brand { fill: #FF4D6D; }
    .chip { fill: #0E2A31; stroke: #1C3D45; }
    .pill { fill: #0E2A31; stroke: #24474F; stroke-width: 1.5; }
    .pill-text { fill: #DCE5E7; font-size: 17px; font-weight: 600; }
    .signal { stroke: #FF824D; } .signal-dot { fill: #FF824D; }
    .open { stroke: #E30031; } .open-dot { fill: #FF4D6D; }
    .done { stroke: #41C47A; } .done-dot { fill: #41C47A; }
    .flow { stroke: #3B5D65; stroke-width: 2; stroke-dasharray: 6 8; fill: none; animation: flow 1.2s linear infinite; }
    .pulse { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .rise { opacity: 0; animation: rise .7s ease-out forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .25s; } .d3 { animation-delay: .4s; }
    .d4 { animation-delay: .6s; } .d5 { animation-delay: .8s; } .d6 { animation-delay: 1s; }
    text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  </style>

  <rect class="card" x="0" y="0" width="1200" height="420" rx="28"/>
  <g opacity=".6">
    <line class="grid" x1="0" y1="105" x2="1200" y2="105"/>
    <line class="grid" x1="0" y1="275" x2="1200" y2="275"/>
  </g>

  <g class="rise d1">
    <rect class="chip" x="56" y="44" width="262" height="36" rx="18"/>
    <circle class="open-dot pulse" cx="80" cy="62" r="6"/>
    <text x="96" y="67.5" class="muted" font-size="13" font-weight="600" letter-spacing="1.6">ON SHIFT · MONTREAL, QC</text>
  </g>

  <text class="ink rise d2" x="56" y="168" font-size="58" font-weight="700" letter-spacing="-1.2">Arman Hosseinmardi</text>
  <text class="ink rise d3" x="58" y="212" font-size="25" font-weight="500">Full stack software developer at <tspan class="brand" font-weight="700">Nurau</tspan> · shift-level risk intelligence</text>
  <text class="muted rise d3" x="58" y="248" font-size="18">I turn what frontline teams see, say and record into risks a manager can act on.</text>

  <g class="rise d4">
    <rect class="pill" x="56" y="314" width="104" height="44" rx="22"/>
    <text class="pill-text" x="108" y="342" text-anchor="middle">voice</text>
    <rect class="pill" x="170" y="314" width="112" height="44" rx="22"/>
    <text class="pill-text" x="226" y="342" text-anchor="middle">camera</text>
    <rect class="pill" x="292" y="314" width="100" height="44" rx="22"/>
    <text class="pill-text" x="342" y="342" text-anchor="middle">notes</text>
  </g>

  <path class="flow rise d5" d="M402 336 H478"/>
  <g class="rise d5">
    <rect class="pill signal" x="488" y="314" width="128" height="44" rx="22"/>
    <circle class="signal-dot" cx="512" cy="336" r="5"/>
    <text class="pill-text" x="560" y="342" text-anchor="middle">signal</text>
  </g>

  <path class="flow rise d5" d="M626 336 H702"/>
  <g class="rise d6">
    <rect class="pill open" x="712" y="314" width="150" height="44" rx="22"/>
    <circle class="open-dot pulse" cx="736" cy="336" r="5"/>
    <text class="pill-text" x="795" y="342" text-anchor="middle">risk event</text>
  </g>

  <path class="flow rise d6" d="M872 336 H948"/>
  <g class="rise d6">
    <rect class="pill done" x="958" y="314" width="150" height="44" rx="22"/>
    <path d="M977 336 l6 6 l12 -13" stroke="#41C47A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="pill-text" x="1046" y="342" text-anchor="middle">resolved</text>
  </g>
</svg>
